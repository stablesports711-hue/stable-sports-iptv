name: STABLE-SPORTS TV Auto Update

on:
  workflow_dispatch:

schedule:
  # বাংলাদেশ সময় -> UTC সময়

  # সকাল ৫:০০ (UTC ২৩:০০ আগের দিন)
  - cron: '0 23 * * *'
  # সকাল ৫:৩০ (UTC ২৩:৩০ আগের দিন)
  - cron: '30 23 * * *'

  # সকাল ৬:০০ (UTC ০০:০০)
  - cron: '0 0 * * *'
  # সকাল ৬:৩০ (UTC ০০:৩০)
  - cron: '30 0 * * *'

  # সকাল ৭:০০ (UTC ০১:০০)
  - cron: '0 1 * * *'
  # সকাল ৭:৩০ (UTC ০১:৩০)
  - cron: '30 1 * * *'

  # সকাল ৮:০০ (UTC ০২:০০)
  - cron: '0 2 * * *'
  # সকাল ৮:৩০ (UTC ০২:৩০)
  - cron: '30 2 * * *'

  # সকাল ৯:০০ (UTC ০৩:০০)
  - cron: '0 3 * * *'
  # সকাল ৯:৩০ (UTC ০৩:৩০)
  - cron: '30 3 * * *'

  # সকাল ১০:০০ (UTC ০৪:০০)
  - cron: '0 4 * * *'
  # সকাল ১০:৩০ (UTC ০৪:৩০)
  - cron: '30 4 * * *'

  # সকাল ১১:০০ (UTC ০৫:০০)
  - cron: '0 5 * * *'
  # সকাল ১১:৩০ (UTC ০৫:৩০)
  - cron: '30 5 * * *'

  # দুপুর ১২:০০ (UTC ০৬:০০)
  - cron: '0 6 * * *'
  # দুপুর ১২:৩০ (UTC ০৬:৩০)
  - cron: '30 6 * * *'

  # দুপুর ১:০০ (UTC ০৭:০০)
  - cron: '0 7 * * *'
  # দুপুর ১:৩০ (UTC ০৭:৩০)
  - cron: '30 7 * * *'

  # দুপুর ২:০০ (UTC ০৮:০০)
  - cron: '0 8 * * *'
  # দুপুর ২:৩০ (UTC ০৮:৩০)
  - cron: '30 8 * * *'

  # বিকাল ৩:০০ (UTC ০৯:০০)
  - cron: '0 9 * * *'
  # বিকাল ৩:৩০ (UTC ০৯:৩০)
  - cron: '30 9 * * *'

  # বিকাল ৪:০০ (UTC ১০:০০)
  - cron: '0 10 * * *'
  # বিকাল ৪:৩০ (UTC ১০:৩০)
  - cron: '30 10 * * *'

  # বিকাল ৫:০০ (UTC ১১:০০)
  - cron: '0 11 * * *'
  # বিকাল ৫:৩০ (UTC ১১:৩০)
  - cron: '30 11 * * *'

  # সন্ধ্যা ৬:০০ (UTC ১২:০০)
  - cron: '0 12 * * *'
  # সন্ধ্যা ৬:৩০ (UTC ১২:৩০)
  - cron: '30 12 * * *'

  # রাত ৭:০০ (UTC ১৩:০০)
  - cron: '0 13 * * *'
  # রাত ৭:৩০ (UTC ১৩:৩০)
  - cron: '30 13 * * *'

  # রাত ৮:০০ (UTC ১৪:০০)
  - cron: '0 14 * * *'
  # রাত ৮:৩০ (UTC ১৪:৩০)
  - cron: '30 14 * * *'

  # রাত ৯:০০ (UTC ১৫:০০)
  - cron: '0 15 * * *'
  # রাত ৯:৩০ (UTC ১৫:৩০)
  - cron: '30 15 * * *'

  # রাত ১০:০০ (UTC ১৬:০০)
  - cron: '0 16 * * *'
  # রাত ১০:৩০ (UTC ১৬:৩০)
  - cron: '30 16 * * *'

  # রাত ১১:০০ (UTC ১৭:০০)
  - cron: '0 17 * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Script
        run: python stablesportstv.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update Playlists $(date)" && git push)
